[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gecko"
dynamic = ["version"]
description = "Capture the state of an instrument machine after a crash or anomaly for later diagnosis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
  { name = "Elijah Anakalea-Buckley", email = "elijahab@caltech.edu" },
]
dependencies = [
  "psutil>=5.9",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: System :: Logging",
]

[project.urls]
Repository = "https://github.com/CaltechOpticalObservatories/gecko"
Documentation = "https://caltechopticalobservatories.github.io/gecko/"
Changelog = "https://github.com/CaltechOpticalObservatories/gecko/blob/main/CHANGELOG.md"

[project.scripts]
gecko = "gecko.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=7",
]
lint = [
  "ruff>=0.5",
]
docs = [
  "sphinx>=7",
  "shibuya",
  "myst-parser>=2",
  "sphinx-copybutton",
  "sphinx-design>=0.6",
  "sphinx-argparse>=0.4",
]
dev = [
  "gecko[test,lint]",
  "tox>=4",
]

[tool.setuptools.dynamic]
version = { attr = "gecko.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gecko = ["triage.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
