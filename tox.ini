[tox]
requires =
    tox>=4
env_list =
    py3{8,9,10,11,12}
    lint
    docs

[testenv]
description = run the test suite with {base_python}
extras =
    test
commands =
    pytest {posargs}

[testenv:lint]
description = check code with ruff
skip_install = true
deps =
    ruff>=0.5
commands =
    ruff check {posargs:src tests docs}

[testenv:docs]
description = build the HTML documentation (warnings are errors)
base_python = python3.12
extras =
    docs
commands =
    sphinx-build -W --keep-going -b html docs docs/_build/html {posargs}

[testenv:linkcheck]
description = check external links in the documentation
base_python = {[testenv:docs]base_python}
extras =
    docs
commands =
    sphinx-build -W --keep-going -b linkcheck docs docs/_build/linkcheck {posargs}
